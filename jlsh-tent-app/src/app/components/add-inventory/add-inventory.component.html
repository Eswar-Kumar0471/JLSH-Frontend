<div class="max-w-3xl mx-auto bg-white shadow-xl rounded-xl p-8 mt-8">
  <h2 class="text-3xl font-semibold text-indigo-600 mb-6">➕ Add Inventory Item</h2>

  <form [formGroup]="inventoryForm" (ngSubmit)="onSubmit()" class="space-y-6">

    <!-- Type -->
    <div>
      <label class="block mb-1 font-medium text-gray-700">Item Type</label>
      <input type="text" formControlName="type"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <div *ngIf="inventoryForm.get('type')?.invalid && inventoryForm.get('type')?.touched"
           class="text-red-500 text-sm">Item Type is required.</div>
    </div>

    <!-- Name -->
    <div>
      <label class="block mb-1 font-medium text-gray-700">Item Name</label>
      <input type="text" formControlName="name"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <div *ngIf="inventoryForm.get('name')?.invalid && inventoryForm.get('name')?.touched"
           class="text-red-500 text-sm">Item Name is required.</div>
    </div>

    <!-- Size/Variant -->
    <div>
      <label class="block mb-1 font-medium text-gray-700">Size / Variant</label>
      <input type="text" formControlName="sizeOrVariant"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    </div>

    <!-- Quantity -->
    <div>
      <label class="block mb-1 font-medium text-gray-700">Quantity Available</label>
      <input type="number" formControlName="quantityAvailable"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    </div>

    <!-- Unit Price -->
    <div>
      <label class="block mb-1 font-medium text-gray-700">Unit Price (₹)</label>
      <input type="number" step="0.01" formControlName="unitPrice"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    </div>

    <!-- Description -->
    <div>
      <label class="block mb-1 font-medium text-gray-700">Description</label>
      <textarea formControlName="description" rows="3"
                class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
    </div>

    <!-- Is Active -->
    <div class="flex items-center">
      <input type="checkbox" formControlName="isActive" class="mr-2" />
      <label class="text-gray-700">Is Active</label>
    </div>

    <!-- Submit -->
    <div>
      <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg shadow">
        Add Item
      </button>
      
    </div>
  </form>
</div>
