<div class="max-w-xl mx-auto mt-10 p-6 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-6">Edit Inventory Item</h2>
  
    <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block font-semibold">Type</label>
        <input formControlName="type" class="form-input w-full" />
      </div>
  
      <div class="mb-4">
        <label class="block font-semibold">Name</label>
        <input formControlName="name" class="form-input w-full" />
      </div>
  
      <div class="mb-4">
        <label class="block font-semibold">Size or Variant</label>
        <input formControlName="sizeOrVariant" class="form-input w-full" />
      </div>
  
      <div class="mb-4">
        <label class="block font-semibold">Quantity Available</label>
        <input type="number" formControlName="quantityAvailable" class="form-input w-full" />
      </div>
  
      <div class="mb-4">
        <label class="block font-semibold">Unit Price</label>
        <input type="number" formControlName="unitPrice" class="form-input w-full" />
      </div>
  
      <div class="mb-4">
        <label class="block font-semibold">Description</label>
        <textarea formControlName="description" class="form-textarea w-full"></textarea>
      </div>
  
      <div class="mb-6">
        <label class="inline-flex items-center">
          <input type="checkbox" formControlName="isActive" class="form-checkbox" />
          <span class="ml-2">Is Active?</span>
        </label>
      </div>
  
      <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded">
        Update Item
      </button>
    </form>
  </div>
