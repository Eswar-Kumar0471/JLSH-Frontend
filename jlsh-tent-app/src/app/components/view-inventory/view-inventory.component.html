<div class="p-6">
    <h2 class="text-2xl font-bold mb-4 text-purple-700">📦 All Inventory Items</h2>
  
    <table class="min-w-full bg-white rounded-lg shadow-md">
      <thead class="bg-gradient-to-r from-purple-600 to-pink-500 text-white">
        <tr>
          <th class="px-4 py-2 text-left">Name</th>
          <th class="px-4 py-2 text-left">Type</th>
          <th class="px-4 py-2 text-left">Size/Variant</th>
          <th class="px-4 py-2 text-left">Qty</th>
          <th class="px-4 py-2 text-left">Price</th>
          <th class="px-4 py-2 text-left">Active</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of inventoryItems" class="border-b">
          <td class="px-4 py-2">{{ item.name }}</td>
          <td class="px-4 py-2">{{ item.type }}</td>
          <td class="px-4 py-2">{{ item.sizeOrVariant || '-' }}</td>
          <td class="px-4 py-2">{{ item.quantityAvailable }}</td>
          <td class="px-4 py-2">₹ {{ item.unitPrice }}</td>
          <td class="px-4 py-2">
            <span class="text-green-600 font-semibold" *ngIf="item.isActive">Yes</span>
            <span class="text-red-500 font-semibold" *ngIf="!item.isActive">No</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
